name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows / MSVC / smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the Visual Studio solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) { throw "Visual Studio MSBuild was not found." }
          & "$installPath\MSBuild\Current\Bin\amd64\MSBuild.exe" Samples\console\console.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run smoke tests
        working-directory: Samples/console
        shell: pwsh
        run: .\x64\Release\console.exe --smoke

  linux:
    name: Linux / ${{ matrix.compiler }} / smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++ clang
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run smoke test
        run: ctest --test-dir build --output-on-failure

  android-ndk:
    name: Android / NDK / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Configure and build
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-android -G Ninja \
            -DNEOSCRIPT_BUILD_SMOKE=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build-android --parallel
